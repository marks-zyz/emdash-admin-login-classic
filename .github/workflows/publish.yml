name: publish

# Publishes to npm when the version in package.json changes on main. No token and no passkey:
# npm trusts this workflow through OIDC (trusted publishing), which needs `id-token: write` and
# npm 11.5.1 or newer. A version that is already on npm is skipped, so a push that does not bump
# the version publishes nothing. Run it by hand from the Actions tab with workflow_dispatch.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Is there anything to publish?
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet. The first publish is manual, then npm trust links this workflow (see CONTRIBUTING.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
