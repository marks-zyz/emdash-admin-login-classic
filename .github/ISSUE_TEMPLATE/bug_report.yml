name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If you found a **security** problem, do not open an issue: use "Report a vulnerability" in the Security tab (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Exact error text helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /_emdash/admin/login
        2. ...
    validations:
      required: true
  - type: input
    id: emdash
    attributes:
      label: EmDash version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: emdash-admin-login-classic version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where it runs
      options:
        - Cloudflare Workers
        - Node
        - Local dev server only
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 26 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Worker logs, browser console, network response. Remove emails, tokens and the secret first.
